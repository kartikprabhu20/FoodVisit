
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.mintanable.foodvisit'
    compileSdk 36

    defaultConfig {
        applicationId "com.mintanable.foodvisit"
        minSdk 26
        targetSdk 36

        def refName = System.getenv("GITHUB_REF_NAME") ?: "1.0.0"
        def rawBuildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        def buildNumber = rawBuildNumber.toInteger()
        def gitTag = (refName == "main" || refName == "master") ? "1.0.${buildNumber}" : refName

        versionCode 100 + buildNumber
        versionName gitTag.startsWith("v") ? gitTag.substring(1) : gitTag

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true


        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

        buildConfigField "String", "GOOGLE_MAPS_KEY", "\"${localProps['GOOGLE_MAPS_KEY'] ?: ''}\""
        buildConfigField "String", "ADMOB_APP_ID",    "\"${localProps['ADMOB_APP_ID'] ?: ''}\""

        manifestPlaceholders = [
            googleMapsKey: localProps['GOOGLE_MAPS_KEY'] ?: '',
            admobAppId:    localProps['ADMOB_APP_ID']    ?: ''
        ]
    }

    signingConfigs {
        config {
            keyAlias 'keystore'
            keyPassword 'FoodVisit'
            storeFile file('../FoodVisitKeystore.jks')
            storePassword 'FoodVisit'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {}
        create("canary") {
            initWith(getByName("debug"))
            signingConfig signingConfigs.debug
            matchingFallbacks.add("debug")
        }
    }

    flavorDimensions += "tier"
    productFlavors {
        paid {
            dimension "tier"
            versionName "1.0-paid"
        }
        free {
            dimension "tier"
            versionName "1.0-free"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/LICENSE*"
            excludes += "META-INF/NOTICE*"
            excludes += "META-INF/*.kotlin_module"
        }
    }

    configurations.all {
        resolutionStrategy {
            // This stops the 'Dependency requires AGP 8.9.1' error
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'

            // Also force lifecycle down if you see similar errors there
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
        }
    }
}

dependencies {
    // AndroidX Core
    implementation('androidx.core:core:1.13.1') {
        version { strictly '1.13.1' }
    }
    implementation('androidx.core:core-ktx:1.13.1') {
        version { strictly '1.13.1' }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.57'
    ksp 'com.google.dagger:hilt-compiler:2.57'

    // Room
    def roomVersion = '2.7.0-alpha11'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Compose BOM — pins all androidx.compose.* versions
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose core
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    // Navigation Compose + Hilt integration
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Image loading (coil-compose for AsyncImage)
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Compose debug tooling
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Modules
    implementation project(':core:model')

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Maps & Places for Compose
    implementation 'com.google.maps.android:maps-compose:6.4.1'
    implementation 'com.google.maps.android:maps-ktx:5.1.1'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation("com.google.android.libraries.places:places:4.1.0")
}
